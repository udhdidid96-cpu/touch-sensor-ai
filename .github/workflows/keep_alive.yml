name: Keep Render Web Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep-Alive Ping to Render Server
        run: |
          curl -s -f "https://touch-sensor-ai.onrender.com/api/v6/health" || curl -s "https://touch-sensor-ai.onrender.com/" || true
          echo "Keep-alive ping sent successfully!"
