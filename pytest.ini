[pytest]
testpaths = tests
python_files = test_*.py
# No --basetemp here on purpose. Pinning it to .pytest_temp put pytest's scratch
# directory inside the repo: pytest wipes basetemp at session start, so anything
# else written there (a redirected log, a second run) made every test error with
# WinError 32, and git saw the directory.
#
# The replacement lives in tests/conftest.py pytest_configure(), which points
# basetemp at the OS temp directory instead. It is set there and not here
# because the path has to be computed at runtime, and because pytest's default
# (no basetemp at all) is not usable on this machine - see the docstring there.
