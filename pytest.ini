[pytest]
testpaths = tests
python_files = test_*.py
# No --basetemp here on purpose. Pinning it to .pytest_temp put pytest's
# scratch directory inside the repo, where two things went wrong: pytest wipes
# that directory at session start, so anything else written there (a redirected
# log, a second concurrent run) made every test error out with WinError 32, and
# a repo-local scratch path is shared state between sessions. The default is a
# per-session directory under the OS temp root, which is per-run and disposable.
